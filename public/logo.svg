<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Primary Gradient -->
    <linearGradient id="eremGradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    
    <!-- Secondary Glowing Gradient -->
    <linearGradient id="eremGradGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Accent Energy Gradient -->
    <linearGradient id="eremGradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="eremFilterGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Cyber Hex Shield -->
  <path d="M50 6 L88 27 L88 73 L50 94 L12 73 L12 27 Z" 
        stroke="url(#eremGradGlow)" 
        stroke-width="2.5" 
        stroke-linejoin="round" 
        opacity="0.35" />

  <!-- Inner Tech Nodes Grid -->
  <circle cx="50" cy="6" r="2.5" fill="#38bdf8" opacity="0.7" />
  <circle cx="88" cy="27" r="2.5" fill="#818cf8" opacity="0.7" />
  <circle cx="88" cy="73" r="2.5" fill="#6366f1" opacity="0.7" />
  <circle cx="50" cy="94" r="2.5" fill="#38bdf8" opacity="0.7" />
  <circle cx="12" cy="73" r="2.5" fill="#06b6d4" opacity="0.7" />
  <circle cx="12" cy="27" r="2.5" fill="#38bdf8" opacity="0.7" />

  <!-- Futuristic Ribbon 'E' & 'S' Master Emblem -->
  <!-- Upper Ribbon Segment -->
  <path d="M26 31 C26 24 32 19 40 19 L74 19 C78 19 81 22 80 26 L78 31 C77 34 74 36 70 36 L44 36 C40 36 38 38 38 41 C38 44 40 46 44 46 L68 46 C77 46 83 52 83 61 C83 70 76 77 67 77 L30 77 C25 77 22 73 23 68 L24 63 C25 59 29 57 34 57 L62 57 C65 57 67 55 67 53 C67 51 65 49 62 49 L40 49 C30 49 26 42 26 31 Z" 
        fill="url(#eremGradMain)" />

  <!-- Dynamic Accent Ribbons -->
  <path d="M44 19 L74 19 C78 19 81 22 80 26 L78 31 C77 34 74 36 70 36 L52 36 Z" 
        fill="url(#eremGradGlow)" 
        opacity="0.8" />

  <!-- Core Energy Diamond / Node -->
  <g filter="url(#eremFilterGlow)">
    <polygon points="50,11 57,22 50,33 43,22" fill="url(#eremGradAccent)" />
    <polygon points="50,67 57,78 50,89 43,78" fill="url(#eremGradGlow)" opacity="0.9" />
    <!-- Center Core Glow -->
    <circle cx="50" cy="50" r="5" fill="#FFFFFF" />
    <circle cx="50" cy="50" r="9" stroke="#38bdf8" stroke-width="1.8" opacity="0.85" />
  </g>
</svg>
