<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gOrangePrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9100" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>

    <linearGradient id="gOrangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc000" />
      <stop offset="100%" stop-color="#ff6a00" />
    </linearGradient>

    <linearGradient id="gWhiteOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffb366" />
    </linearGradient>

    <linearGradient id="gHexBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="50%" stop-color="#ff6b00" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  {/* Background Rounded Shield */}
  <rect width="100" height="100" rx="22" fill="#0f172a" />
  <rect x="2" y="2" width="96" height="96" rx="20" stroke="url(#gHexBorder)" stroke-width="2.5" fill="none" />

  {/* Outer Hexagon Frame */}
  <path
    d="M50 10 L84 29 L84 71 L50 90 L16 71 L16 29 Z"
    stroke="url(#gHexBorder)"
    stroke-width="5"
    stroke-linejoin="round"
  />

  {/* Inner Hexagon Line */}
  <path
    d="M50 16 L78 32 L78 68 L50 84 L22 68 L22 32 Z"
    stroke="#ffffff"
    stroke-width="1.2"
    stroke-opacity="0.35"
    stroke-linejoin="round"
  />

  {/* Stylized Letter 'I' Pillar */}
  <g>
    <rect x="25" y="30" width="13" height="42" rx="3.5" fill="url(#gWhiteOrange)" stroke="#ffffff" stroke-width="0.8" />
    <rect x="25" y="30" width="13" height="13" rx="3" fill="url(#gOrangePrimary)" />
  </g>

  {/* Stylized Letter 'T' Crossbar & Pillar */}
  <g>
    <path d="M43 30 C43 27 46 25 49 25 L75 25 C78 25 81 27 81 30 L81 35 C81 38 78 40 75 40 L49 40 C46 40 43 38 43 35 Z" fill="url(#gOrangePrimary)" stroke="#ffffff" stroke-width="0.8" />
    <path d="M56 40 L68 40 L68 69 C68 72 65 74 62 74 C59 74 56 72 56 69 Z" fill="url(#gOrangeGlow)" stroke="#ffffff" stroke-width="0.8" />
  </g>

  {/* Center High-Tech Core Node */}
  <circle cx="62" cy="32.5" r="4.5" fill="#ffffff" />
  <circle cx="62" cy="32.5" r="2.2" fill="#ff6b00" />
</svg>
